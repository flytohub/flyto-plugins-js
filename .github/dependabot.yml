# Routine bumps arrive as one pull request per ecosystem; majors stay
# individual so a breaking change is reviewed on its own. Ungrouped, a week of
# updates fans out into one pull request per package, and each one needs a
# generated artifact regenerated by hand before it can go green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
